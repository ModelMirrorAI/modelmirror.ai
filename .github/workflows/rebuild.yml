# Daily rebuild so the site picks up data its prebuild fetches read from other
# repositories. It never commits here. The `build` job runs the same install
# and build Cloudflare Pages runs, and the `poke` job calls the Cloudflare
# Pages deploy hook only once that build passes. The fetches fail closed, so
# an upstream change that breaks the site keeps the last good deploy live;
# building here first turns that into a red scheduled run, which notifies the
# maintainer, instead of a silent failure inside Cloudflare. Only `poke` holds
# the deploy-hook secret.
#
# The state-ags board workflow also dispatches this run each time it publishes
# a changed board, passing the board commit. The raw file host caches the
# branch copy for a few minutes, so the build first waits until the branch
# serves that commit's board; Cloudflare's own build, started by `poke`, then
# reads the same fresh copy.
name: rebuild
on:
  schedule:
    - cron: "37 11 * * *"   # 11:37 UTC daily
  workflow_dispatch:
    inputs:
      board_sha:
        description: "state-ags board commit to wait for (optional)"
        required: false
        default: ""
permissions: {}
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Wait for the published board
        if: inputs.board_sha != ''
        env:
          BOARD_SHA: ${{ inputs.board_sha }}
        run: |
          set -euo pipefail
          [[ "$BOARD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "board_sha is not a commit id"; exit 1; }
          base=https://raw.githubusercontent.com/ModelMirrorAI/state-ags
          curl -fsS --retry 3 -o "$RUNNER_TEMP/want.json" "$base/$BOARD_SHA/board.json"
          for _ in $(seq 1 30); do
            curl -fsS --retry 3 -o "$RUNNER_TEMP/have.json" "$base/refs/heads/board/board.json"
            if cmp -s "$RUNNER_TEMP/want.json" "$RUNNER_TEMP/have.json"; then
              echo "The board branch serves $BOARD_SHA."
              exit 0
            fi
            sleep 30
          done
          echo "The board branch still serves an older board after 15 minutes."
          exit 1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  poke:
    needs: build
    runs-on: ubuntu-latest
    # The deploy-hook secret lives in the `deploy` environment, which accepts
    # only `main`, so no workflow on another branch can read it.
    environment: deploy
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          test -n "$HOOK" || { echo "CLOUDFLARE_DEPLOY_HOOK_URL secret is not set"; exit 1; }
          curl -fsS -X POST "$HOOK"
